# Pushing a version tag (v1.2.0) builds the app and publishes it as a PRE-release. Installed copies only update to the
# release marked "Latest" - promote a tested pre-release on GitHub ("Set as the latest release") to ship it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          dotnet publish AlwaysOnTop.csproj -c Release -o out -p:Version=$version
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          Compress-Archive -Path "out/Always on Top.exe" -DestinationPath AlwaysOnTop-win-x64.zip
          $hash = (Get-FileHash AlwaysOnTop-win-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AlwaysOnTop-win-x64.zip" | Out-File -Encoding ascii AlwaysOnTop-win-x64.zip.sha256

      - name: Publish pre-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create $env:TAG AlwaysOnTop-win-x64.zip AlwaysOnTop-win-x64.zip.sha256 --prerelease --generate-notes --title $env:TAG
